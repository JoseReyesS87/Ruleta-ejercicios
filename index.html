<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ruleta de Ejercicios para Niños 🎡</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .container {
    max-width: 500px;
    width: 100%;
  }

  h1 {
    color: white;
    font-size: 32px;
    margin-bottom: 30px;
    text-align: center;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  .wheel-section {
    background: white;
    border-radius: 30px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    margin-bottom: 20px;
  }

  .wheel-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 0 auto 30px;
  }

  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 10px solid #333;
    overflow: hidden;
    transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.5);
    position: relative;
  }

  .wheel::before {
    content: '';
    position: absolute;
    width: 60px;
    height: 60px;
    background: white;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }

  .wheel::after {
    content: '🎯';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 11;
    font-size: 24px;
  }

  .wheel div {
    position: absolute;
    width: 50%;
    height: 50%;
    top: 50%;
    left: 50%;
    transform-origin: 0% 0%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    padding: 5px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.7);
  }

  #pointer {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-bottom: 35px solid #ff4757;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
    z-index: 20;
    animation: bounce 0.5s ease-in-out infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateX(-50%) translateY(0); }
    to { transform: translateX(-50%) translateY(-5px); }
  }

  .btn {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 40px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,107,107,0.4);
    transition: all 0.3s;
    width: 100%;
    margin-bottom: 10px;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255,107,107,0.5);
  }

  .btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: linear-gradient(135deg, #5f27cd, #341f97);
    box-shadow: 0 6px 20px rgba(95,39,205,0.4);
  }

  .btn-success {
    background: linear-gradient(135deg, #26de81, #20bf6b);
    box-shadow: 0 6px 20px rgba(38,222,129,0.4);
  }

  #result {
    background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #2d3436;
    text-align: center;
    box-shadow: 0 5px 15px rgba(253,203,110,0.4);
    animation: slideIn 0.5s ease-out;
  }

  @keyframes slideIn {
    from { 
      opacity: 0;
      transform: translateY(-20px);
    }
    to { 
      opacity: 1;
      transform: translateY(0);
    }
  }

  .timer-container {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .timer-display {
    font-size: 48px;
    font-weight: 700;
    color: #667eea;
    margin: 10px 0;
  }

  .timer-label {
    font-size: 14px;
    color: #666;
    margin-bottom: 15px;
  }

  .progress-ring {
    transform: rotate(-90deg);
  }

  .progress-ring-circle {
    transition: stroke-dashoffset 0.3s;
  }

  .history-section {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .history-title {
    font-size: 18px;
    font-weight: 700;
    color: #333;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stats {
    background: linear-gradient(135deg, #a8e6cf, #7ed6df);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    font-weight: 600;
    color: #2d3436;
  }

  .history-item {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }

  .history-empty {
    text-align: center;
    color: #999;
    padding: 20px;
    font-style: italic;
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: #f0f;
    position: absolute;
    animation: confetti-fall 3s linear forwards;
  }

  @keyframes confetti-fall {
    to {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }

  .hidden {
    display: none;
  }

  @media (max-width: 500px) {
    h1 { font-size: 24px; }
    .wheel-container { width: 280px; height: 280px; }
    .wheel div { font-size: 11px; }
    .btn { font-size: 18px; padding: 14px 30px; }
    .timer-display { font-size: 36px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🎡 Ruleta de Ejercicios</h1>
    
    <div class="wheel-section">
      <div class="wheel-container">
        <div id="pointer"></div>
        <div class="wheel" id="wheel"></div>
      </div>
      
      <button class="btn" id="spinBtn" onclick="spin()">🎲 ¡GIRAR LA RULETA!</button>
      
      <div id="result" class="hidden"></div>
      
      <div id="timerSection" class="timer-container hidden">
        <div class="timer-label">Tiempo restante</div>
        <div class="timer-display" id="timerDisplay">1:00</div>
        <svg width="120" height="120" style="margin: 10px auto; display: block;">
          <circle class="progress-ring-circle" stroke="#e0e0e0" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
          <circle id="progressCircle" class="progress-ring-circle" stroke="#667eea" stroke-width="8" fill="transparent" r="52" cx="60" cy="60" stroke-dasharray="326.73" stroke-dashoffset="0"/>
        </svg>
        <button class="btn btn-success" id="completeBtn" onclick="completeExercise()">✅ ¡Completado!</button>
        <button class="btn btn-secondary" onclick="resetTimer()">🔄 Nuevo ejercicio</button>
      </div>
    </div>

    <div class="history-section">
      <div class="history-title">
        <span>📊 Mis Ejercicios</span>
        <span id="totalCount" style="font-size: 14px; color: #667eea;">0 realizados</span>
      </div>
      <div class="stats" id="stats">
        ¡Empieza a ejercitarte para ver tus estadísticas! 💪
      </div>
      <div id="historyList" class="history-empty">
        Aún no has completado ejercicios. ¡Dale a girar! 🎯
      </div>
    </div>
  </div>

  <script>
    const ejercicios = [
      { nombre: "🐾 Carrera de animales", categoria: "Cardio" },
      { nombre: "🧱 Saltar obstáculos", categoria: "Cardio" },
      { nombre: "🎨 Correr al color", categoria: "Cardio" },
      { nombre: "🪢 Saltar la cuerda", categoria: "Cardio" },
      { nombre: "🧊 Corre y congélate", categoria: "Cardio" },
      { nombre: "🎶 Baile libre", categoria: "Cardio" },
      { nombre: "🔁 Carrera de relevos", categoria: "Cardio" },
      { nombre: "⬜ Saltos en cuadrado", categoria: "Cardio" },
      { nombre: "🦸 Flexiones superhéroe", categoria: "Fuerza" },
      { nombre: "🐸 Sentadillas del sapo", categoria: "Fuerza" },
      { nombre: "🐊 Plancha cocodrilo", categoria: "Fuerza" },
      { nombre: "🧗 Trepa imaginaria", categoria: "Fuerza" },
      { nombre: "🥋 Patadas karate", categoria: "Fuerza" },
      { nombre: "🦀 Puente del cangrejo", categoria: "Fuerza" },
      { nombre: "🎯 Tiro con pelota", categoria: "Fuerza" },
      { nombre: "🌳 Postura del árbol", categoria: "Equilibrio" },
      { nombre: "🔄 Círculos brazos", categoria: "Equilibrio" },
      { nombre: "➖ Caminar en línea", categoria: "Equilibrio" },
      { nombre: "🐱 Estiramiento gato", categoria: "Equilibrio" },
      { nombre: "🌬️ Respira y crece", categoria: "Equilibrio" }
    ];

    const colores = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e', '#e17055', '#74b9ff'];
    const wheel = document.getElementById("wheel");
    let isSpinning = false;
    let currentExercise = null;
    let timerInterval = null;
    let timeLeft = 60;
    let history = [];

    // Crear segmentos de la ruleta
    ejercicios.forEach((ej, i) => {
      const segment = document.createElement("div");
      const deg = i * (360 / ejercicios.length);
      segment.innerHTML = ej.nombre;
      segment.style.background = colores[i % colores.length];
      segment.style.transform = `rotate(${deg}deg) skewY(-${90 - 360 / ejercicios.length}deg)`;
      wheel.appendChild(segment);
    });

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      
      document.getElementById("result").classList.add("hidden");
      document.getElementById("timerSection").classList.add("hidden");
      document.getElementById("spinBtn").disabled = true;

      const spins = 5 + Math.random() * 5;
      const deg = spins * 360 + Math.floor(Math.random() * 360);
      wheel.style.transform = `rotate(${deg}deg)`;

      setTimeout(() => {
        const normalized = deg % 360;
        const index = Math.floor(ejercicios.length - (normalized / 360) * ejercicios.length) % ejercicios.length;
        currentExercise = ejercicios[index];
        
        showResult(currentExercise.nombre);
        createConfetti();
        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;
      }, 5000);
    }

    function showResult(exercise) {
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `🎉 ¡Te tocó! 🎉<br><strong>${exercise}</strong><br>Prepárate para 1 minuto de diversión! 💪`;
      resultDiv.classList.remove("hidden");
      
      setTimeout(() => {
        document.getElementById("timerSection").classList.remove("hidden");
        startTimer();
      }, 1000);
    }

    function startTimer() {
      timeLeft = 60;
      updateTimerDisplay();
      
      if (timerInterval) clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          completeExercise();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById("timerDisplay").textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
      
      const circumference = 2 * Math.PI * 52;
      const offset = circumference - (timeLeft / 60) * circumference;
      document.getElementById("progressCircle").style.strokeDashoffset = offset;
    }

    function completeExercise() {
      if (!currentExercise) return;
      
      clearInterval(timerInterval);
      
      history.unshift({
        exercise: currentExercise.nombre,
        categoria: currentExercise.categoria,
        date: new Date().toLocaleString('es-ES', { 
          day: '2-digit', 
          month: '2-digit', 
          hour: '2-digit', 
          minute: '2-digit' 
        })
      });
      
      if (history.length > 10) history = history.slice(0, 10);
      
      updateHistory();
      createConfetti();
      
      document.getElementById("result").innerHTML = 
        `🌟 ¡Excelente trabajo! 🌟<br>Has completado: <strong>${currentExercise.nombre}</strong>`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById("timerSection").classList.add("hidden");
      document.getElementById("result").classList.add("hidden");
      currentExercise = null;
    }

    function updateHistory() {
      const historyDiv = document.getElementById("historyList");
      const totalCount = document.getElementById("totalCount");
      const statsDiv = document.getElementById("stats");
      
      totalCount.textContent = `${history.length} realizados`;
      
      if (history.length === 0) {
        historyDiv.innerHTML = '<div class="history-empty">Aún no has completado ejercicios. ¡Dale a girar! 🎯</div>';
        statsDiv.innerHTML = '¡Empieza a ejercitarte para ver tus estadísticas! 💪';
        return;
      }
      
      const categoryCounts = {};
      history.forEach(item => {
        categoryCounts[item.categoria] = (categoryCounts[item.categoria] || 0) + 1;
      });
      
      const topCategory = Object.keys(categoryCounts).reduce((a, b) => 
        categoryCounts[a] > categoryCounts[b] ? a : b
      );
      
      statsDiv.innerHTML = `💪 Total: ${history.length} ejercicios | 🏆 Categoría favorita: ${topCategory}`;
      
      historyDiv.innerHTML = history.map(item => 
        `<div class="history-item">
          <span>${item.exercise}</span>
          <span style="font-size: 12px; color: #999;">${item.date}</span>
        </div>`
      ).join('');
    }

    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.background = colores[Math.floor(Math.random() * colores.length)];
          confetti.style.animationDelay = Math.random() * 0.5 + 's';
          document.body.appendChild(confetti);
          
          setTimeout(() => confetti.remove(), 3000);
        }, i * 30);
      }
    }

    // Inicializar historial
    updateHistory();
  </script>
</body>
</html>
